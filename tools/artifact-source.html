<title>Portföy Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F4F0; --surface:#FFFFFF; --sunken:#ECEEE8; --ink:#15201B; --muted:#5B6660; --line:#DCDFD8;
  --accent:#2A45A8; --accent-soft:#E6EAF8; --on-accent:#FFFFFF;
  --gain:#16794A; --gain-soft:#E2F2E8; --loss:#C23A2B; --loss-soft:#F8E4E1; --warn:#9A620F; --warn-soft:#F7EBD6;
  --shadow:0 1px 2px rgba(21,32,27,.06),0 6px 24px rgba(21,32,27,.06);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1412; --surface:#171D1A; --sunken:#121815; --ink:#E6EAE6; --muted:#97A29C; --line:#2A322E;
    --accent:#8FA6F5; --accent-soft:#1E2640; --on-accent:#0F1412;
    --gain:#4CC486; --gain-soft:#15291E; --loss:#F07A6B; --loss-soft:#2E1714; --warn:#E0AE55; --warn-soft:#2C2211;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1412; --surface:#171D1A; --sunken:#121815; --ink:#E6EAE6; --muted:#97A29C; --line:#2A322E;
  --accent:#8FA6F5; --accent-soft:#1E2640; --on-accent:#0F1412;
  --gain:#4CC486; --gain-soft:#15291E; --loss:#F07A6B; --loss-soft:#2E1714; --warn:#E0AE55; --warn-soft:#2C2211;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
#main{display:flex;flex-direction:column;gap:18px}
#main>*{min-width:0}
/* 7–8 figures: two even rows of four instead of a row of six and a half-empty second row */
/* exactly 6 figures on a medium window: 3+3 so large amounts do not wrap */
@media (min-width:600px) and (max-width:1199px){.kpis:has(>.kpi:nth-child(6)):not(:has(>.kpi:nth-child(7))){grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.kpis:has(>.kpi:nth-child(7)){grid-template-columns:repeat(4,minmax(0,1fr))}.kpis:has(>.kpi:nth-child(9)){grid-template-columns:repeat(5,minmax(0,1fr))}}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:19px}
h3{font-size:15px;font-family:var(--f-body);font-weight:600}
p{margin:0}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .sub{color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;background:var(--sunken);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok .dot{background:var(--gain)} .chip.warn .dot{background:var(--warn)} .chip.bad .dot{background:var(--loss)}
.chip.lock{color:var(--ink)}

/* banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.err{background:var(--loss-soft);border-color:color-mix(in srgb,var(--loss) 35%,transparent)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner p{max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:11.5px;margin-left:6px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 45%,transparent)}
.btn.danger.armed{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn.ghost{background:none;border-color:transparent;padding:6px 8px;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;font-family:var(--f-mono)}
.linkbtn:hover{text-decoration:underline}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi .v{font-family:var(--f-mono);font-size:21px;font-weight:600;letter-spacing:-.01em}
.kpi .d{font-size:12.5px;font-family:var(--f-mono)}
.up{color:var(--gain)} .down{color:var(--loss)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}

/* allocation */
.alloc{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunken)}
.alloc span{display:block;height:100%}
.legend{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;font-size:13.5px}
.sw{width:10px;height:10px;border-radius:2px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right}
td.in{color:var(--accent)}
tr.flag td{background:color-mix(in srgb,var(--loss-soft) 70%,transparent)}
tr.dup td{background:color-mix(in srgb,var(--warn-soft) 70%,transparent)}
tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--sunken)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.buy{background:var(--gain-soft);color:var(--gain)}
.pill.sell{background:var(--loss-soft);color:var(--loss)}
.pill.bonus{background:var(--accent-soft);color:var(--accent)}
.pill.div{background:var(--warn-soft);color:var(--warn)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--loss-soft);color:var(--loss)}
.pill.ok{background:var(--gain-soft);color:var(--gain)}
.pill.neutral{background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.src{font-size:11px;color:var(--muted);font-family:var(--f-body)}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent);font-family:var(--f-mono);font-size:14px}
.field select{font-family:var(--f-body);color:var(--ink)}
.field input::placeholder{color:var(--muted);opacity:.7}
.field .hint{font-size:11.5px;color:var(--muted)}
.field.wide,.form .check.wide{grid-column:1/-1}
.form-actions{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.err-msg{color:var(--loss);font-size:13px}
.ok-msg{color:var(--gain);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* notes list */
.warnlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.warnlist li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--warn-soft)}
.warnlist li.bad{background:var(--loss-soft)}
.warnlist li.ok{background:var(--gain-soft)}
.warnlist b{font-family:var(--f-mono)}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--ground);border-radius:12px;width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);margin:auto 0}
.drawer{background:var(--ground);width:min(620px,100%);height:100%;overflow-y:auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.drawer-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bigprice{font-family:var(--f-mono);font-size:30px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-mono);font-weight:600;font-size:16px}
svg.spark{width:100%;height:90px;display:block}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:520px){h1{font-size:22px}.kpi .v{font-size:18px}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Portföy Defteri</h1>
      <p class="sub">BIST hisseleri ve TEFAS fonları için kişisel takip · hesaplamalar otomatik</p>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<footer class="wrap small muted" style="padding-block:0 32px">Fiyatlar internetteki ücretsiz kaynaklardan 15 dakika gecikmeli toplanır ve doğruluğu garanti edilmez. Bu sayfadaki hesaplamalar bilgilendirme amaçlıdır, yatırım tavsiyesi değildir.</footer>
<div id="overlay"></div>
<div id="modal"></div>
<input type="file" id="xl-in" accept=".xlsx,.xlsm,.xls,.csv,text/csv" hidden>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf2 = new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf3 = new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:4});
const nf0 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
const TL = n => (n==null||!isFinite(n)) ? "—" : nf2.format(n) + " TL";
const TLs = n => (n==null||!isFinite(n)) ? "—" : (n>0?"+":"") + nf2.format(n) + " TL";
const PX = n => (n==null||!isFinite(n)) ? "—" : nf3.format(n);
const LOT = n => (n==null||!isFinite(n)) ? "—" : nf0.format(n);
const PCT = n => (n==null||!isFinite(n)) ? "—" : (n>0?"+":"") + nf2.format(n*100) + "%";
const cls = n => (n==null||!isFinite(n)||Math.abs(n)<1e-9) ? "" : (n>0?"up":"down");
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = s => { if(!s) return "—"; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[3]+"."+m[2]+"."+m[1] : esc(s); };
const uid6 = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
function parseNum(v){
  if(v==null) return NaN; if(typeof v==="number") return v;
  let s=String(v).replace(/TL|₺|%|LOT|ADET|\s/gi,"").trim(); if(!s || s==="-") return NaN;
  if(s.includes(",")){ s=s.replace(/\./g,"").replace(",","."); }
  else if(/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s)){ s=s.replace(/\./g,""); }
  return Number(s);
}
const EMAIL_RE=/^[^\s@<>"',;]+@[^\s@<>"',;]+\.[A-Za-z]{2,}$/;
const KOD_RE=/^[A-Z0-9]{2,8}$/;
// Codes typed on a Turkish keyboard or copied from elsewhere: "ecİlc", "BIST:ECILC", "ECILC.IS" → "ECILC"
const kodNorm=v=>String(v??"").trim().toUpperCase().replace(/İ/g,"I").replace(/Ş/g,"S").replace(/Ğ/g,"G").replace(/Ü/g,"U").replace(/Ö/g,"O").replace(/Ç/g,"C").replace(/\s+/g,"").replace(/^BIST:/,"").replace(/\.(IS|E)$/,"");
const TYPES=["Alış","Satış","Bedelsiz","Temettü"];
const PALETTE=["#2A45A8","#16794A","#B5651D","#7B3FA0","#1F7F8C","#A83255","#6B7A2A","#4F5B66"];
let toastT;
function toast(msg,ms=2600){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,ms); }

/* ---------- example data (shown until the viewer starts their own ledger) ---------- */
const ORNEK = {
  v:1, ornek:true,
  hisseler:[{kod:"THYAO",tip:"Hisse",ad:"Türk Hava Yolları"},{kod:"ASELS",tip:"Hisse",ad:"Aselsan"},{kod:"TUPRS",tip:"Hisse",ad:"Tüpraş"},{kod:"AFT",tip:"Fon",ad:"Ak Portföy Yeni Teknolojiler Yabancı Hisse Senedi Fonu",vergiSinifi:"diger"}],
  kurumlar:[{ad:"Örnek Aracı Kurum",tip:"oran",deger:0.02,min:0,bsmv:true}], ayarlar:{beyanSiniri:400000},
  islemler:[
    {id:"o1",no:1,kod:"THYAO",tarih:"2026-02-10",tur:"Alış",lot:200,fiyat:285.50,komisyon:11.99,kurum:"Örnek Aracı Kurum",grup:"",not:"Örnek kayıt",t:1},
    {id:"o2",no:2,kod:"ASELS",tarih:"2026-03-04",tur:"Alış",lot:500,fiyat:120.40,komisyon:12.64,kurum:"Örnek Aracı Kurum",grup:"",not:"Örnek kayıt",t:2},
    {id:"o3",no:3,kod:"TUPRS",tarih:"2026-04-15",tur:"Alış",lot:150,fiyat:165.00,komisyon:5.20,kurum:"Örnek Aracı Kurum",grup:"",not:"Örnek kayıt",t:3},
    {id:"o4",no:4,kod:"AFT",tarih:"2026-04-20",tur:"Alış",lot:10000,fiyat:0.95,komisyon:0,kurum:"Örnek Aracı Kurum",grup:"",not:"Örnek kayıt",t:4},
    {id:"o5",no:5,kod:"TUPRS",tarih:"2026-05-28",tur:"Temettü",lot:0,fiyat:0,komisyon:0,tutar:450,kurum:"Örnek Aracı Kurum",grup:"",not:"Örnek kayıt",t:5},
    {id:"o6",no:6,kod:"ASELS",tarih:"2026-06-20",tur:"Satış",lot:200,fiyat:140.10,komisyon:5.88,kurum:"Örnek Aracı Kurum",grup:"",not:"Örnek kayıt",t:6}
  ],
  elleFiyat:{}
};
const BOS = () => ({v:1, ornek:false, hisseler:[], kurumlar:[], islemler:[], elleFiyat:{}, ayarlar:{beyanSiniri:BEYAN_SINIRI_2026}});
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
const S = {
  tab: "ozet", demo:true, defter: clone(ORNEK), piyasa:{veriler:{}}, gecmis:{veriler:{}}, temettu:null, durum:null,
  rapor:null, db:null, dl:null, uid:null, connected:false, readOnly:false, err:null,
  detay:null, edit:null, filtre:"", loaded:false
};

/* ---------- calculation engine (weighted average cost, per group) ---------- */
function fiyatOf(kod){
  const p=S.piyasa.veriler?.[kod]; const e=S.defter.elleFiyat?.[kod];
  if(e && isFinite(e.fiyat) && (!p || !isFinite(p.fiyat) || (e.tarih||"") >= String(p.tarih||"").slice(0,10))) return {fiyat:e.fiyat,onceki:null,tarih:e.tarih,kaynak:"Elle girildi",elle:true};
  if(p && isFinite(p.fiyat)) return {fiyat:p.fiyat,onceki:isFinite(p.onceki)?p.onceki:null,tarih:p.tarih,kaynak:p.kaynak||"Otomatik",elle:false,ad:p.ad,dogrulama:p.dogrulama||null,not:p.not||"",eski:isGunuAcigi(String(p.tarih||"").slice(0,10),today())>=2};
  return null;
}
/* ---------- Turkish tax rules (as of 28.09.2026) ---------- */
const FON_SINIF={
  hisseYogun:"Hisse senedi yoğun fon (TEFAS) · %0",
  serbestHisse:"Serbest hisse yoğun fon (TEFAS dışı)",
  bist51:"Portföyü ≥%51 BIST hissesi olan fon",
  girisim:"Girişim sermayesi / gayrimenkul fonu",
  diger:"Diğer fonlar (değişken, borçlanma, para piyasası, katılım…)"
};
function fonDonemOrani(alis){
  if(alis<"2020-12-23") return 0.10;
  if(alis<="2024-04-30") return 0;
  if(alis<="2024-10-31") return 0.075;
  if(alis<="2025-01-31") return 0.10;
  if(alis<="2025-07-08") return 0.15;
  return 0.175;
}
function isGunuAcigi(a,b){ // weekdays strictly between two ISO dates
  if(!/^\d{4}-\d{2}-\d{2}$/.test(a)) return 0; let d=new Date(a+"T12:00:00"), e=new Date(b+"T12:00:00"), n=0;
  for(d.setDate(d.getDate()+1); d<e; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w!==0&&w!==6) n++; } return n; }
const KALITE={"iki-kaynak":{t:"2 kaynakla doğrulandı",c:"ok"},"tek-kaynak":{t:"Tek kaynak",c:"neutral"},"uyusmazlik":{t:"Kaynaklar uyuşmuyor",c:"warn"},"supheli":{t:"Olağan dışı hareket",c:"warn"}};
function kaliteHtml(f){ if(!f) return ""; if(f.elle) return `<span class="pill neutral">Elle girildi</span>`; const k=KALITE[f.dogrulama]; let h=k?`<span class="pill ${k.c}">${k.t}</span>`:""; if(f.eski) h+=` <span class="pill bad">Güncel değil</span>`; return h; }
const gunFark=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
// Trades without a date: buys and bonus issues count as the oldest records, sales and dividends as the newest.
// Profit by weighted-average purchase price does not depend on dates; only the split between realised and open profit does.
const siraTarih=x=>x.tarih||(x.tur==="Satış"||x.tur==="Temettü"?"9999-12-31":"");
const siraKarsilastir=(a,b)=>{ const x=siraTarih(a), y=siraTarih(b); return x<y?-1:x>y?1:(a.t||0)-(b.t||0); };
const TARIHSIZ="Tarihsiz";
function fonOran(sinif,alis,satis){
  // an unknown purchase date is treated as a purchase just before the sale (current rate, short holding)
  if(!satis) satis=today(); if(!alis) alis=satis;
  switch(sinif){
    case "hisseYogun": return 0;
    case "serbestHisse": return alis>="2026-03-27"?0.175:0;
    case "bist51": return gunFark(alis,satis)>365?0:fonDonemOrani(alis);
    case "girisim": return gunFark(alis,satis)>730?0:fonDonemOrani(alis);
    default: return fonDonemOrani(alis);
  }
}
const temettuOran=t=>!t||t>="2024-12-22"?0.15:0.10;
const BEYAN_SINIRI_2026=400000;

function getiri(kod,fiyat,gunGeri,yilBasi){
  const g=S.gecmis?.veriler?.[kod]; if(!g||!g.length||!isFinite(fiyat)) return null;
  let hedef; if(yilBasi){ hedef=(new Date().getFullYear()-1)+"-12-31"; } else { const d=new Date(); d.setDate(d.getDate()-gunGeri); hedef=d.toISOString().slice(0,10); }
  let ref=null; for(const [t,c] of g){ if(t<=hedef) ref=+c; else break; }
  return ref>0?fiyat/ref-1:null;
}
// Profit/loss is measured against the purchase price: weighted average of buy prices (commission not included;
// commissions are totalled separately). A bonus issue adds lots at zero cost, which lowers the average.
function hesapla(d){
  const out={poz:{},satir:{},toplam:{},uyarilar:[],olaylar:[]};
  const hs=new Map(d.hisseler.map(h=>[h.kod,h]));
  const list=[...d.islemler].sort(siraKarsilastir);
  const sig=new Map();
  for(const x of list){ if(x.tur==="Temettü") continue; const k=[x.kod,x.tarih,x.tur,x.lot,x.fiyat].join("|"); sig.set(k,(sig.get(k)||0)+1); }
  const P=kod=>out.poz[kod] ||= {kod,tip:hs.get(kod)?.tip||"Hisse",sinif:hs.get(kod)?.vergiSinifi||"diger",ad:hs.get(kod)?.ad||"",lot:0,maliyet:0,gerceklesen:0,temettu:0,komisyon:0,alinan:0,satilan:0,fifo:[],bozuk:false,mukerrer:false,islemSay:0,satislar:[]};
  for(const h of d.hisseler) P(h.kod);
  for(const x of list){
    const p=P(x.kod); p.islemSay++;
    const lot=+x.lot||0, fiy=+x.fiyat||0, kom=+x.komisyon||0;
    p.komisyon+=kom;
    let note=null;
    const yil=x.tarih?String(x.tarih).slice(0,4):TARIHSIZ;
    if(x.tur==="Alış"&&!(fiy>0)){ note={lvl:"warn",msg:"Alış fiyatı girilmemiş; bu alım maliyetsiz sayılıyor ve kâr/zararı olduğundan yüksek gösterir. Fiyatı gir ya da bedelsizse türünü Bedelsiz yap."}; p.fiyatsizAlis=true; }
    if(x.tur==="Alış"){ p.lot+=lot; p.maliyet+=lot*fiy; p.alinan+=lot; if(lot>0) p.fifo.push({tarih:x.tarih,lot,birim:fiy}); }
    else if(x.tur==="Bedelsiz"){ p.lot+=lot; p.alinan+=lot; if(lot>0) p.fifo.push({tarih:x.tarih,lot,birim:0}); }
    else if(x.tur==="Satış"){
      p.satilan+=lot;
      if(lot>p.lot+1e-9){ note={lvl:"bad",msg:x.tarih?"Satılan lot ("+LOT(lot)+") o tarihte eldeki lottan ("+LOT(p.lot)+") fazla. Önceki bir alım eksik olabilir.":"Tarihsiz satış en son işlem sayılır; satılan lot ("+LOT(lot)+") yine de eldeki lottan ("+LOT(p.lot)+") fazla. Bir alım eksik olabilir."}; p.bozuk=true; p.maliyet=0; p.lot-=lot; p.fifo=[]; }
      else {
        const ort=p.lot>0?p.maliyet/p.lot:0; const r=lot*(fiy-ort);
        p.gerceklesen+=r; p.maliyet-=lot*ort; p.lot-=lot; if(p.lot<1e-9){ p.lot=0; p.maliyet=0; }
        p.satislar.push({tarih:x.tarih,lot,fiyat:fiy,ort,kazanc:r});
        // fund withholding is computed first-in-first-out by purchase date, as intermediaries do
        let kalan=lot, stopaj=0, tahmini=!x.tarih;
        while(kalan>1e-9 && p.fifo.length){ const c=p.fifo[0]; const m=Math.min(kalan,c.lot); if(p.tip==="Fon"){ stopaj+=m*(fiy-c.birim)*fonOran(p.sinif,c.tarih,x.tarih); if(!c.tarih) tahmini=true; } c.lot-=m; kalan-=m; if(c.lot<=1e-9) p.fifo.shift(); }
        out.olaylar.push({yil,tarih:x.tarih,kod:x.kod,tip:p.tip,tur:"satis",kazanc:r,stopaj:p.tip==="Fon"?Math.max(0,stopaj):0,tahmini:p.tip==="Fon"&&tahmini});
      }
    }
    else if(x.tur==="Temettü"){ const net=+x.tutar||0, o=temettuOran(x.tarih), brut=net/(1-o); p.temettu+=net; out.olaylar.push({yil,tarih:x.tarih,kod:x.kod,tip:p.tip,tur:"temettu",net,brut,stopaj:brut-net,oran:o}); }
    if(!note && x.tur!=="Temettü"){ const k=[x.kod,x.tarih,x.tur,x.lot,x.fiyat].join("|"); if(sig.get(k)>1){ note={lvl:"warn",msg:x.tarih?"Aynı gün, aynı lot ve fiyatla ikinci kayıt. Mükerrer olabilir.":"Tarihsiz, aynı lot ve fiyatla ikinci kayıt. Mükerrer olabilir."}; p.mukerrer=true; } }
    if(note) out.satir[x.id]=note;
  }
  let T={deger:0,maliyet:0,kz:0,gerceklesen:0,temettu:0,komisyon:0,gunluk:0,gunlukBaz:0,fiyatsiz:0,tutarsiz:0,acik:0};
  for(const p of Object.values(out.poz)){
    p.ort=p.lot>0?p.maliyet/p.lot:null;
    const f=fiyatOf(p.kod); p.f=f;
    if(!p.ad && f?.ad) p.ad=f.ad;
    T.temettu+=p.temettu; T.komisyon+=p.komisyon;
    if(p.bozuk){ T.tutarsiz++; p.deger=p.kz=p.kzYuzde=null; continue; }
    T.temettuTutarli=(T.temettuTutarli||0)+p.temettu; T.komisyonTutarli=(T.komisyonTutarli||0)+p.komisyon;
    T.gerceklesen+=p.gerceklesen;
    if(p.lot>0){
      T.acik++;
      if(f){ p.deger=p.lot*f.fiyat; p.kz=p.deger-p.maliyet; p.kzYuzde=p.maliyet>0?p.kz/p.maliyet:null;
        T.deger+=p.deger; T.maliyet+=p.maliyet; T.kz+=p.kz;
        if(f.onceki){ p.gunluk=p.lot*(f.fiyat-f.onceki); p.gunlukYuzde=f.fiyat/f.onceki-1; T.gunluk+=p.gunluk; T.gunlukBaz+=p.lot*f.onceki; }
      } else { p.deger=p.kz=p.kzYuzde=null; T.fiyatsiz++; }
      if(f){ p.perf={hafta:getiri(p.kod,f.fiyat,7),ay:getiri(p.kod,f.fiyat,30),yil:getiri(p.kod,f.fiyat,0,true)}; }
      if(p.tip==="Fon" && f){ let s=0; const bugun=today(); for(const c of p.fifo){ s+=c.lot*(f.fiyat-c.birim)*fonOran(p.sinif,c.tarih,bugun); if(!c.tarih) p.acikStopajTahmini=true; } p.acikStopaj=Math.max(0,s); T.acikStopaj=(T.acikStopaj||0)+p.acikStopaj; }
      const h=hs.get(p.kod);
      if(h && f){ if(h.hedef && f.fiyat>=h.hedef) p.alarm={t:"hedef",msg:"Hedef fiyata ("+PX(h.hedef)+") ulaştı"}; else if(h.stop && f.fiyat<=h.stop) p.alarm={t:"stop",msg:"Zarar-durdur seviyesinin ("+PX(h.stop)+") altında"}; }
    }
  }
  T.kzYuzde=T.maliyet>0?T.kz/T.maliyet:null;
  T.gunlukYuzde=T.gunlukBaz>0?T.gunluk/T.gunlukBaz:null;
  // everything this ledger produced: open and realised profit plus dividends, minus all commissions paid
  T.sonuc=T.kz+T.gerceklesen+(T.temettuTutarli||0)-(T.komisyonTutarli||0);
  out.toplam=T;
  for(const p of Object.values(out.poz)){
    if(p.bozuk) out.uyarilar.push({lvl:"bad",kod:p.kod,msg:"Satışlar alımlardan fazla. Maliyet ve kâr/zarar hesaplanamıyor, toplamlara katılmadı. İşlemler sekmesinde kırmızı satırları kontrol edin."});
    else if(p.mukerrer) out.uyarilar.push({lvl:"warn",kod:p.kod,msg:"Olası mükerrer kayıt var. İşlemler sekmesinde sarı satırlara bakın."});
    if(!p.bozuk && p.fiyatsizAlis) out.uyarilar.push({lvl:"warn",kod:p.kod,msg:"Fiyatı girilmemiş bir alış var; maliyet eksik olduğu için kâr/zarar yüksek görünür. İşlemler sekmesinde sarı satıra bak."});
    if(!p.bozuk && p.lot>0 && p.f && !p.f.elle){
      if(p.f.eski) out.uyarilar.push({lvl:"warn",kod:p.kod,msg:"Fiyat "+fmtDate(String(p.f.tarih).slice(0,10))+" tarihli, güncellenemedi. Hesaplar bu fiyatla yapılıyor; istersen detaydan elle gir."});
      if(p.f.dogrulama==="uyusmazlik"||p.f.dogrulama==="supheli") out.uyarilar.push({lvl:"warn",kod:p.kod,msg:(p.f.dogrulama==="supheli"?"Fiyatta olağan dışı bir hareket var":"Fiyat kaynakları birbirini tutmuyor")+(p.f.not?" ("+p.f.not+")":"")+". Aracı kurum uygulamandan kontrol et."});
    }
    if(!p.bozuk && !p.f && (p.lot>0 || kodHatasi(p.kod)?.bulunamadi)){ const h=kodHatasi(p.kod);
      out.uyarilar.push(h&&h.bulunamadi?{lvl:"bad",kod:p.kod,msg:"Bu kod hiçbir fiyat kaynağında bulunamadı; yanlış yazılmış olabilir. Doğru kodu (örneğin Eczacıbaşı İlaç için ECILC) TradingView ya da aracı kurum uygulamandan kontrol et, bu kodu hisse detayından silip doğrusunu ekle."}
        :{lvl:"warn",kod:p.kod,msg:h?"Fiyat alınamadı ("+h.tarih+"). Kaynaklar bağlantı hatası verdi; internet bağlantını kontrol edip fiyatları yeniden güncelle.":"Güncel fiyat yok. Fiyatları güncelleyin ya da hisse detayından elle girin."}); }
    if(p.alarm) out.uyarilar.push({lvl:p.alarm.t==="stop"?"bad":"ok",kod:p.kod,msg:p.alarm.msg+"."});
  }
  out.temettuOneri=temettuBul(d,list);
  return out;
}
// The price module's last attempt for a code that has no price: {mesaj, bulunamadi, tarih} or null.
function kodHatasi(kod){ return (S.durum&&S.durum.kodHata&&S.durum.kodHata[kod])||null; }
// Dividends the price module found (per-share amounts, adjusted back for later bonus issues) on dates the ledger held lots,
// which are not in the ledger yet. Shown for confirmation; nothing is added on its own.
function temettuBul(d,list){
  const T=S.temettu?.veriler; if(!T) return [];
  const yoksay=new Set(d.temettuYoksay||[]), out=[];
  for(const kod of Object.keys(T)){
    const ev=T[kod]; if(!ev||!(ev.temettu||[]).length) continue;
    const isl=list.filter(x=>x.kod===kod); if(!isl.length) continue;
    for(const [tarih,hisseBasi] of ev.temettu){
      if(yoksay.has(kod+"|"+tarih)) continue;
      // an undated record only counts from the day it was entered into the ledger: we do not know it was held earlier
      let lot=0; for(const x of isl){ if((x.tarih||x.girildi||"9999-12-31")>=tarih) continue; if(x.tur==="Alış"||x.tur==="Bedelsiz") lot+=+x.lot||0; else if(x.tur==="Satış") lot-=+x.lot||0; }
      if(!(lot>0)) continue;
      const kayitli=isl.some(x=>x.tur==="Temettü"&&gunFark(tarih,x.tarih)>=-7&&gunFark(tarih,x.tarih)<=60);
      if(kayitli) continue;
      let carpan=1; for(const [bt,oran] of (ev.bolunme||[])) if(bt>tarih) carpan*=oran;
      const hb=hisseBasi*carpan, brut=lot*hb, o=temettuOran(tarih);
      out.push({kod,tarih,lot,hisseBasi:hb,brut,net:brut*(1-o),oran:o,kurum:[...isl].reverse().find(x=>x.kurum)?.kurum||""});
    }
  }
  return out.sort((a,b)=>a.tarih<b.tarih?1:-1);
}

/* ---------- persistence ---------- */
let saving=false, pending=false, dirty=false, saveTimer=null, raporTimer=null;
function commit(msg){
  S.calc=hesapla(S.defter); render(); if(msg) toast(msg);
  if(S.demo || !S.db || !S.uid) return;
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,350);
  if(S.rapor?.aktif){ clearTimeout(raporTimer); raporTimer=setTimeout(syncRapor,1200); }
}
async function flush(){
  if(saving){ pending=true; return; }
  saving=true;
  try{ await S.db.doc("data/users/"+S.uid+"/defter").set(clone(S.defter)); S.err=null; }
  catch(e){ S.err=e?.code==="quota_exceeded"?"Kayıt alanı doldu. Eski işlemleri silip tekrar deneyin.":"Değişiklik kaydedilemedi ("+(e?.code||"hata")+"). Sayfayı yenileyip tekrar deneyin."; if(e?.code==="invalid_argument") S.readOnly=true; renderBanner(); }
  saving=false; if(pending){ pending=false; flush(); } else dirty=false;
}
function raporPayload(email,aktif){
  const c=S.calc||hesapla(S.defter);
  return {aktif:!!aktif, email, onay:true, guncelleme:new Date().toISOString(),
    pozisyonlar:Object.values(c.poz).filter(p=>p.lot!==0||p.bozuk).map(p=>{const h=S.defter.hisseler.find(x=>x.kod===p.kod)||{}; return {kod:p.kod,tip:p.tip,ad:p.ad||"",lot:p.lot,ort:p.ort,maliyet:p.maliyet,baz:p.maliyet,hedef:h.hedef||null,stop:h.stop||null,tutarsiz:p.bozuk,elleFiyat:S.defter.elleFiyat?.[p.kod]||null};}),
    gerceklesen:c.toplam.gerceklesen, temettu:c.toplam.temettu, komisyon:c.toplam.komisyon,
    nakit:null,
    uyarilar:c.uyarilar.filter(u=>u.lvl!=="ok").map(u=>u.kod+": "+u.msg)};
}
async function syncRapor(){
  if(!S.db||!S.uid||!S.rapor?.aktif) return;
  try{ await S.db.doc("rapor/"+S.uid).set(raporPayload(S.rapor.email,true)); }catch(e){ console.warn(e); }
}
async function ensureSembol(kod,tip){
  if(!S.db) return;
  try{ const r=S.db.doc("semboller/"+kod); const s=await r.get(); if(!s.exists) await r.set({kod,tip}); }catch(e){ console.warn(e); }
}
async function baslat(ornekle){
  if(!S.db||!S.uid){ toast("Kendi defterini başlatmak için giriş yapmış olman gerekiyor."); return; }
  try{ const ex=await S.db.doc("data/users/"+S.uid+"/defter").get(); if(ex.exists){ S.defter=Object.assign(BOS(),clone(ex.data())); S.demo=false; S.calc=hesapla(S.defter); render(); toast("Kayıtlı defterin açıldı; üzerine yazılmadı"); return; } }catch(e){}
  const d = ornekle ? Object.assign(clone(ORNEK),{ornek:true}) : BOS();
  S.defter=d; S.demo=false; commit(ornekle?"Örnek veriler defterine kopyalandı":"Boş defter hazır");
  for(const h of d.hisseler) ensureSembol(h.kod,h.tip);
}

/* ---------- render ---------- */
const TABS=[["ozet","Özet"],["poz","Pozisyonlar"],["islem","İşlemler"],["vergi","Vergi"],["rapor","Günlük rapor"],["ayar","Ayarlar ve gizlilik"]];
const EK_GORUNUM={};
function render(){ if(!S.calc) S.calc=hesapla(S.defter); renderChips(); renderBanner(); renderTabs(); renderMain(); renderDrawer(); }
// Prices can arrive at any moment (background refresh). Never redraw a form the viewer is filling in: those parts wait for the next redraw.
function duzenleniyor(kok){ const k=$(kok); if(!k) return false;
  // only fields whose value differs from what was drawn count: redrawing an untouched (even focused) field loses nothing
  return [...k.querySelectorAll("form input,form textarea")].some(i=>!/checkbox|radio|hidden|file/.test(i.type)&&i.value!==i.defaultValue)
    // a select with no "selected" attribute starts on its first option
    ||[...k.querySelectorAll("form select")].some(x=>{ const d=[...x.options].findIndex(o=>o.defaultSelected); return !x.multiple&&x.options.length&&x.selectedIndex!==(d<0?0:d); }); }
// Background data (prices, dividends, status) never redraws a form the viewer is filling in. The redraw waits and
// happens as soon as the form is back to what was drawn (cleared, submitted or left untouched).
function arkaPlanRender(){ if(!S.calc) S.calc=hesapla(S.defter); renderChips(); renderBanner(); renderTabs();
  if(duzenleniyor("#main")) S.bekleyenMain=true; else renderMain();
  if(duzenleniyor("#overlay")) S.bekleyenDrawer=true; else renderDrawer(); }
function bekleyenCiz(){ if(S.bekleyenMain&&!duzenleniyor("#main")) renderMain(); if(S.bekleyenDrawer&&!duzenleniyor("#overlay")) renderDrawer(); }
setInterval(bekleyenCiz,700);

  if(f) parts.push(`<span class="chip ${sorun?"warn":"ok"}"><span class="dot"></span>Fiyatlar: ${esc(f)}${sorun?` · ${sorun} fiyat kontrol bekliyor`:""}</span>`);
  else if(!S.defter.islemler.length&&!S.defter.hisseler.length) parts.push(`<span class="chip"><span class="dot"></span>Henüz hisse ya da fon yok</span>`);

function kpi(label,val,delta,dcls){ return `<div class="kpi"><span class="label">${label}</span><span class="v">${val}</span>${delta!=null?`<span class="d ${dcls||""}">${delta}</span>`:""}</div>`; }

function vOzet(){
  const T=S.calc.toplam; const P=Object.values(S.calc.poz);

const sonrakiNo=()=>S.defter.islemler.reduce((m,x)=>Math.max(m,+x.no||0),0)+1;
function kurumOpts(sel){ return S.defter.kurumlar.map(k=>`<option ${k.ad===sel?"selected":""}>${esc(k.ad)}</option>`).join("")+`<option value="" ${!sel?"selected":""}>Belirtilmedi</option>`; }
function kurumHacmi(kurumAd,tarih,gun,haricId){
  const d=new Date((tarih||today())+"T12:00:00"); d.setDate(d.getDate()-(+gun||0)); const bas=d.toISOString().slice(0,10); const son=tarih||today();
  return S.defter.islemler.filter(x=>x.kurum===kurumAd&&x.id!==haricId&&(x.tur==="Alış"||x.tur==="Satış")&&x.tarih>bas&&x.tarih<=son).reduce((a,x)=>a+(+x.lot||0)*(+x.fiyat||0),0);
}
function kurumOrani(k,tutar,tarih,haricId){
  if(k.tip!=="kademeli") return {oran:+k.deger};
  const hacim=kurumHacmi(k.ad,tarih,k.gun,haricId)+tutar;
  const kd=(k.kademeler||[]).find(t=>t.ust==null||hacim<=t.ust)||(k.kademeler||[]).slice(-1)[0];
  return {oran:kd?+kd.oran:0,hacim};
}
function komHesap(kurumAd,tutar,tarih,haricId){ const k=S.defter.kurumlar.find(x=>x.ad===kurumAd); if(!k||!isFinite(tutar)||tutar<=0) return 0; let v=k.tip==="sabit"?+k.deger:tutar*kurumOrani(k,tutar,tarih,haricId).oran/100; v=Math.max(v,+k.min||0); if(k.bsmv) v*=1.05; return Math.round(v*100)/100; }

function spark(kod){
  const g=S.gecmis?.veriler?.[kod]; if(!g||g.length<2) return `<p class="small muted">Fiyat geçmişi, fiyatlar güncellendikçe burada çizilir.</p>`;
  const pts=g.slice(-120); const vals=pts.map(p=>+p[1]); const mn=Math.min(...vals), mx=Math.max(...vals); const W=560,H=90,pad=6;
  const x=i=>pad+i*(W-2*pad)/(pts.length-1), y=v=>H-pad-(mx===mn?0.5:(v-mn)/(mx-mn))*(H-2*pad);
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(+p[1]).toFixed(1)).join(" ");
  const up=vals[vals.length-1]>=vals[0]; const col=up?"var(--gain)":"var(--loss)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(kod)} fiyat geçmişi">
    <line x1="0" x2="${W}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)" stroke-width="1"/><line x1="0" x2="${W}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)" stroke-width="1"/>
    <path d="${d} L${x(pts.length-1)} ${H} L${x(0)} ${H} Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(pts.length-1)}" cy="${y(vals[vals.length-1])}" r="3.5" fill="${col}"/></svg>
    <div class="row small muted" style="justify-content:space-between"><span>${fmtDate(pts[0][0])}</span><span>en düşük ${PX(mn)} · en yüksek ${PX(mx)}</span><span>${fmtDate(pts[pts.length-1][0])}</span></div>`;
}

function simUpdate(){
  const out=$("#sim-out"); if(!out) return; const p=S.calc.poz[S.detay]; if(!p) return;
  const lot=parseNum($("#s-lot").value), fy=parseNum($("#s-fiyat").value);
  if(!(lot>0)||!(fy>0)){ out.textContent="Lot ve fiyat gir."; return; }
  if(lot>p.lot){ out.innerHTML=`<span class="down">Elindeki lottan (${LOT(p.lot)}) fazla.</span>`; return; }
  const tut=lot*fy, kom=komHesap($("#s-kurum").value,tut,today()), kz=lot*(fy-(p.ort||0));
  out.innerHTML=`Tutar ${TL(tut)} · kâr/zarar <span class="${cls(kz)}">${TLs(kz)}</span> (satış − alış fiyatı) · ayrıca komisyon ${TL(kom)}`;
}

let armed=null, armT=null;
function arm(key,btn,label){ if(armed===key){ armed=null; clearTimeout(armT); return true; } armed=key; btn.classList.add("armed"); const old=btn.textContent; btn.textContent=label; clearTimeout(armT); armT=setTimeout(()=>{armed=null; btn.classList.remove("armed"); btn.textContent=old;},4000); return false; }

  if(a==="rapor-kapat"){ if(!arm("rk",t,"Kapatmak için tekrar tıkla")) return; try{ await S.db.doc("rapor/"+S.uid).delete(); S.rapor=null; render(); toast("Rapor kapatıldı, paylaşılan özet silindi"); }catch(e){ toast("Kapatılamadı, tekrar dene."); } return; }

  if(a==="poz-tum"||a==="poz-acik"){ S.pozFiltre=a==="poz-acik"?"acik":"tum"; renderMain(); return; }
  if(a==="ice-kapat"){ if(ev.target===t){ S.ice=null; renderModal(); } return; }
  if(a==="ice-kapat-btn"){ S.ice=null; renderModal(); return; }
  if(a==="ice-uygula"){ iceUygula(t); return; }
  if(a==="xlsx-disa"){ xlsxDisa(); return; }
});

document.addEventListener("click",ev=>{ const t=ev.target.closest("[data-temettu-ekle],[data-temettu-yoksay]"); if(t){ temettuEylem(t); }

document.addEventListener("submit",async ev=>{
  ev.preventDefault(); const id=ev.target.id;
  if(id==="f-sim") return;
  if(id==="f-rapor") return raporKaydet();
  if(S.demo&&["f-hisse","f-islem"].includes(id)&&S.db&&S.uid){
    const deger={}; ev.target.querySelectorAll("input,select,textarea").forEach(e=>{ if(e.id) deger[e.id]=e.type==="checkbox"?e.checked:e.value; });
    await baslat(false);
    for(const [k,v] of Object.entries(deger)){ const e=document.getElementById(k); if(!e) continue; if(e.type==="checkbox") e.checked=v; else if(e.tagName==="SELECT"&&![...e.options].some(o=>o.value===v)) continue; else e.value=v; }
    if(S.demo) return;
  }
  if(!guard()) return;
  if(id==="f-hisse"){
    const kod=kodNorm($("#h-kod").value), tip=$("#h-tip").value, ad=$("#h-ad").value.trim(), hedef=parseNum($("#h-hedef").value), stop=parseNum($("#h-stop").value);
    const err=$("#h-err");
    if(!KOD_RE.test(kod)) return err.textContent="Kod 2–8 harf ya da rakam olmalı (örn. THYAO, AFT).";
    if(S.defter.hisseler.some(h=>h.kod===kod)) return err.textContent=kod+" zaten listede.";
    S.defter.hisseler.push({kod,tip,ad,hedef:hedef>0?hedef:null,stop:stop>0?stop:null,vergiSinifi:tip==="Fon"?$("#h-sinif").value:null});
    ensureSembol(kod,tip); commit(kod+(typeof kodEklendi==="function"?" eklendi, fiyatı alınıyor…":" eklendi. Fiyatı bir sonraki sabah güncellemesiyle gelir.")); if(typeof kodEklendi==="function") kodEklendi(kod); return;
  }
  if(id==="f-islem"){
    const err=$("#i-err"); const tur=$("#i-tur").value;
    const x={kod:$("#i-kod").value,tarih:$("#i-tarih").value,tur,lot:parseNum($("#i-lot").value),fiyat:parseNum($("#i-fiyat").value),komisyon:parseNum($("#i-kom").value),kurum:$("#i-kurum").value,grup:$("#i-grup").value.trim(),not:$("#i-not").value.trim(),tutar:parseNum($("#i-tutar").value)};
    if(!x.kod) return err.textContent="Hisse seç.";
    if($("#i-tarih").validity?.badInput||(x.tarih&&!/^\d{4}-\d{2}-\d{2}$/.test(x.tarih))) return err.textContent="Tarih eksik ya da geçersiz. Düzelt ya da tamamen boş bırak.";
    if(!x.tarih) x.girildi=(S.edit&&S.defter.islemler.find(y=>y.id===S.edit)?.girildi)||today(); // dividends are only looked up from this day on
    if(tur==="Temettü"){ if(!(x.tutar>0)) return err.textContent="Temettü tutarını gir."; x.lot=0;x.fiyat=0;x.komisyon=0; }
    else { if(!(x.lot>0)) return err.textContent="Lot sıfırdan büyük olmalı."; if(tur==="Bedelsiz"){x.fiyat=0;x.komisyon=0;} else if(!(x.fiyat>0)) return err.textContent="Fiyat sıfırdan büyük olmalı."; if(!(x.komisyon>=0)) x.komisyon=0; x.tutar=null; }
    if(S.edit){ const i=S.defter.islemler.findIndex(y=>y.id===S.edit); if(i>=0) S.defter.islemler[i]=Object.assign({},S.defter.islemler[i],x); S.edit=null; commit("İşlem güncellendi"); }
    else { x.id=uid6(); x.t=Date.now(); x.no=sonrakiNo(); S.defter.islemler.push(x); commit(x.kod+" "+tur.toLowerCase()+" kaydedildi"); }
    syncIslemForm(); return;
  }
  if(id==="f-kurum"){
    const ad=$("#k-ad").value.trim(), tip=$("#k-tip").value, deger=parseNum($("#k-deger").value), min=parseNum($("#k-min").value);
    if(!ad) return $("#k-err").textContent="Kurum adı gir."; let gun=null,kademeler=null;
    if(tip==="kademeli"){ gun=parseInt($("#k-gun").value,10); if(!(gun>0)) return $("#k-err").textContent="Gün sayısını gir.";
      kademeler=[]; for(const l of $("#k-kademe").value.split(/\n/).map(x=>x.trim()).filter(Boolean)){ const q=l.split(/[\s;]+/); if(q.length===1) kademeler.push({ust:null,oran:parseNum(q[0])}); else kademeler.push({ust:parseNum(q[0]),oran:parseNum(q[1])}); }
      if(!kademeler.length||kademeler.some(t=>!(t.oran>=0)||(t.ust!=null&&!(t.ust>0)))) return $("#k-err").textContent="Kademeleri kontrol et: her satır \"üst sınır oran\" biçiminde olmalı.";
      if(kademeler.some(t=>t.oran>2)) return $("#k-err").textContent="Oranlar yüzde olarak girilir; binde 1,85 için 0,185 yaz.";

    if(tip==="oran"&&deger>2) return $("#k-err").textContent="Oran yüzde olarak girilir; binde 2 için 0,2 yaz.";
    if(S.defter.kurumlar.some(k=>k.ad===ad)) return $("#k-err").textContent="Bu adla bir kurum var.";

  }
  if(id==="f-vergi"){
    const v=parseNum($("#v-sinir").value); if(!(v>0)) return toast("Geçerli bir tutar gir.");
    S.defter.ayarlar ||= {}; S.defter.ayarlar.beyanSiniri=v; delete S.defter.ayarlar.maliyetYontemi; commit("Ayarlar kaydedildi"); return;
  }
  if(id==="f-detay"){
    const k=S.detay; const h=S.defter.hisseler.find(x=>x.kod===k); if(!h) return;
    const hedef=parseNum($("#d-hedef").value), stop=parseNum($("#d-stop").value), elle=parseNum($("#d-elle").value);
    h.ad=$("#d-ad").value.trim(); h.hedef=hedef>0?hedef:null; h.stop=stop>0?stop:null; if($("#d-sinif")) h.vergiSinifi=$("#d-sinif").value;
    S.defter.elleFiyat ||= {}; if(elle>0) S.defter.elleFiyat[k]={fiyat:elle,tarih:today()}; else delete S.defter.elleFiyat[k];
    commit(k+" kaydedildi"); return;
  }
});

function splitCsv(line,sep){ const out=[];let cur="",q=false; for(let i=0;i<line.length;i++){const c=line[i]; if(q){ if(c==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(c==='"') q=false; else cur+=c; } else if(c==='"') q=true; else if(c===sep){out.push(cur);cur="";} else cur+=c;} out.push(cur); return out.map(s=>s.trim()); }

// Excel date cell → "YYYY-MM-DD", or null when the cell is empty or not a real date (the trade is then kept without a date).
function tarihIso(v){
  let y,m,d;
  if(v instanceof Date){ if(isNaN(v)) return null; y=v.getFullYear(); m=v.getMonth()+1; d=v.getDate(); }
  else if(typeof v==="number" || /^\d{5}(\.\d+)?$/.test(String(v??"").trim())){ const n=+v; if(!(n>20000&&n<80000)) return null; const t=new Date(Math.floor(n+1e-6-25569)*864e5); y=t.getUTCFullYear(); m=t.getUTCMonth()+1; d=t.getUTCDate(); }
  else {
    const s=String(v??"").trim(); let r;
    if((r=/(\d{4})[./-](\d{1,2})[./-](\d{1,2})(?!\d)/.exec(s))){ y=+r[1]; m=+r[2]; d=+r[3]; }
    else if((r=/(?<!\d)(\d{1,2})[./-](\d{1,2})[./-](\d{4}|\d{2})(?!\d)/.exec(s))){ d=+r[1]; m=+r[2]; y=+r[3];
      if(r[3].length===2) y+= y<=(new Date().getFullYear()%100)+1?2000:1900;
      if(m>12&&d<=12){ const t=d; d=m; m=t; } } // 03/25/2024 written month-first
    else return null;
  }
  if(!(y>=1980&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31)) return null;
  if(new Date(Date.UTC(y,m-1,d)).getUTCDate()!==d) return null; // 31.02 and the like
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
const metin=v=>String(v??"").trim();

const BASLIK={HISSE:["HISSE","KOD","HISSE_KODU","SEMBOL","FON","FON_KODU","MENKUL","MENKUL_KIYMET","ENSTRUMAN","KIYMET","KIYMET_KODU","VARLIK_KODU","SYMBOL","TICKER"],
  TARIH:["TARIH","ISLEM_TARIHI","ALIS_TARIHI","TARIHI","TARIH/SAAT","TARIH_SAAT","DATE"],
  ISLEM:["ISLEM","ISLEM_TURU","ISLEM_TIPI","ISLEM_YONU","TUR","TIP","YON","ALIS/SATIS","ALIS_SATIS","AL/SAT","AL_SAT"],
  LOT:["LOT","ADET","MIKTAR","PAY","PAY_ADEDI","NOMINAL","LOT_SAYISI","LOT_ADEDI","ADET/LOT","LOT/ADET","ELDEKI_LOT","ALIS_LOT","ALIS_ADEDI","QUANTITY"],
  FIYAT:["FIYAT","BIRIM_FIYAT","ISLEM_FIYATI","GERCEKLESEN_FIYAT","PRICE"],

  ALIS_FIYAT:["ALIS_FIYATI","ALIS_FIYAT","ORT_ALIS_FIYATI","ORTALAMA_ALIS_FIYATI","ORT_ALIS","ORTALAMA_ALIS","ORTALAMA_MALIYET","ORT_MALIYET","BIRIM_MALIYET","MALIYET_FIYATI","MALIYET","ALIS"],

  TUTAR:["TUTAR","ISLEM_TUTARI","TOPLAM_TUTAR","NET_TUTAR","ALIS_TUTARI","TOPLAM_MALIYET"],ARACI_KURUM:["ARACI_KURUM","KURUM"],ISLEM_GRUBU:["ISLEM_GRUBU","GRUP"],NOT:["NOT","ACIKLAMA"]};
const normB=h=>normH(h).replace(/\([^)]*\)/g,"").replace(/[^A-Z0-9_\/]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");

const tahminTip=k=>/^[A-Z][A-Z0-9]{2}$/.test(k)?"Fon":"Hisse";
function turNorm(v){ const t=metin(v); if(TYPES.includes(t)) return t; const n=normB(t);
  if(["ALIS","AL","ALIM","BUY","A"].includes(n)) return "Alış"; if(["SATIS","SAT","SATIM","SELL","S"].includes(n)) return "Satış";

// Reads a transaction table. The date is optional: rows without one are kept as undated trades.
// Layouts: this app's İşlemler sheet (ISLEM column), the old program's DATA sheet (ALINAN_LOT / SATILAN_LOT …),

function islemOku(rows){
  const var_=(r,n)=>r.some(c=>BASLIK[n].includes(normB(c))), ham=(r,n)=>r.some(c=>normB(c)===n);
  const hi=rows.findIndex(r=>var_(r,"HISSE")&&(var_(r,"TARIH")||var_(r,"LOT")||var_(r,"FIYAT")||var_(r,"ALIS_FIYAT")||ham(r,"ALINAN_LOT")||ham(r,"SATILAN_LOT"))); if(hi<0) return null;

  const hk=ix("HISSE"), ikinci=H.findIndex((h,i)=>i>hk&&h==="HISSE"); // old program keeps a helper stock list in a second HISSE column

    const kod=kodNorm(km?km[1]:kh); if(!kod||kod==="0") return;
    if(!KOD_RE.test(kod)||!/[A-Z]/.test(kod)) return atla(satir,"kod anlaşılamadı");
    const tarih=tarihIso(g("TARIH"))||"";
    const base={no:parseInt(g("ISLEM_NO"),10)||null,kod,tarih,komisyon:Math.abs(parseNum(g("KOMISYON")))||0,grup:metin(g("ISLEM_GRUBU")).replace(/^0$/,""),kurum:metin(g("ARACI_KURUM")).replace(/^0$/,""),not:metin(g("NOT"))};

    else if(tur){ const lot=Math.abs(lotH)||0; if(!(lot>0)) return atla(satir,"lot yok");
      const f=birim(lot,fiyH,tur==="Alış"?alisF:parseNum(g("SATIS_FIYATI"))); if(!(f>0)) return atla(satir,"fiyat yok");
      ekle({tur,lot,fiyat:f}); }
    else if(islemHucre&&!vt) return atla(satir,"işlem türü anlaşılamadı ("+islemHucre.slice(0,20)+")");
    else if(eskiDuzen){
      const al=parseNum(g("ALINAN_LOT")), sat=parseNum(g("SATILAN_LOT")), af=parseNum(g("ALIS_FIYATI")), sf=parseNum(g("SATIS_FIYATI")), tem=parseNum(g("TEMETTU"));
      if(al>0) ekle(af>0?{tur:"Alış",lot:al,fiyat:af}:{tur:"Bedelsiz",lot:al,fiyat:0,komisyon:0});
      if(sat>0) ekle(Object.assign({tur:"Satış",lot:sat,fiyat:sf||0},al>0?{komisyon:0}:{}));
      if(tem>0) ekle({tur:"Temettü",lot:0,fiyat:0,komisyon:0,tutar:tem});

    } else {

      if(!(Math.abs(lotH)>0)) return atla(satir,"lot yok");

    }
    if(!tarih) out.tarihsiz+=out.islemler.length-n0;

}
// Old program's BANKA_ISLEMLERI: cash rows from row 17 (A–E); up to 7 brokers in F2:F8, each with a tier table every 14 rows (H/I/J).
function bankaOku(R){

      out.hisseler.push({kod,tip,ad:metin(g("AD")).slice(0,60),hedef:parseNum(g("HEDEF"))>0?parseNum(g("HEDEF")):null,stop:parseNum(g("STOP"))>0?parseNum(g("STOP")):null,vergiSinifi:tip==="Fon"&&FON_SINIF[s]?s:(tip==="Fon"?"diger":null)}); }
    if(bolum==="KURUMLAR"){ const ad=metin(g("AD")).slice(0,40); if(!ad) continue; const tip=["oran","sabit","kademeli"].includes(metin(g("TIP")))?metin(g("TIP")):"oran";
      let kademeler=null; if(tip==="kademeli"){ try{ kademeler=JSON.parse(metin(g("KADEMELER"))).filter(t=>t&&isFinite(+t.oran)).map(t=>({ust:t.ust==null?null:+t.ust,oran:+t.oran})); }catch(e){ continue; } if(!kademeler.length) continue; }
      out.kurumlar.push({ad,tip,deger:tip==="kademeli"?null:(parseNum(g("DEGER"))||0),gun:tip==="kademeli"?(parseInt(g("GUN"),10)||1):null,kademeler,min:parseNum(g("MIN"))||0,bsmv:/^(1|true|evet)$/i.test(metin(g("BSMV")))}); }
  }

}
const BASLIK_ACIKLAMA="Dosyada tanınan bir işlem tablosu yok. Başlık satırında en az Hisse (ya da Kod) ve Lot (ya da Adet) sütunları olmalı; İşlem türü (Alış/Satış), Fiyat (ya da Alış fiyatı / Maliyet), Tarih ve Komisyon sütunları da okunur. Tarih zorunlu değil.";
function dosyaOku(file){
  return new Promise((res,rej)=>{
    const excel=/\.(xlsx|xlsm|xls)$/i.test(file.name), csv=/\.csv$/i.test(file.name);
    if(!excel&&!csv) return rej(new Error("Yalnızca .xlsx, .xlsm, .xls ya da .csv dosyası yüklenebilir."));
    if(file.size>40*1024*1024) return rej(new Error("Dosya çok büyük (en fazla 40 MB)."));
    const rd=new FileReader();
    rd.onerror=()=>rej(new Error("Dosya okunamadı."));
    rd.onload=()=>{ try{
      const P={dosya:file.name,kaynak:"",islemler:[],kurumlar:[],hisseler:[],izleme:[],ayarlar:null,atlanan:0,atlananSatir:[],tarihsiz:0,tipler:{}};
      if(excel){
        if(!xlsxHazir()) throw new Error("Excel okuyucu yüklenemedi. Sayfayı yenileyip tekrar dene.");
        const X=window.XLSX, wb=X.read(new Uint8Array(rd.result),{type:"array"}); // dates stay Excel serials; converted with UTC math in tarihIso
        const tam=nm=>{ const ws=wb.Sheets[nm]; const rg=X.utils.decode_range(ws["!ref"]||"A1:A1"); rg.s.r=0; rg.s.c=0; return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:"",range:rg,blankrows:true}); };
        const ad=n=>wb.SheetNames.find(s=>normH(s)===n);
        const sira=[ad("ISLEMLER"),ad("DATA"),...wb.SheetNames].filter((v,i,a)=>v&&a.indexOf(v)===i);
        let isl=null; for(const [i,nm] of sira.entries()){ const r=islemOku(tam(nm)); if(!r) continue; if(!isl||r.islemler.length>isl.islemler.length) isl=r; if(r.islemler.length&&(nm===ad("ISLEMLER")||nm===ad("DATA"))) break; }
        if(isl){ P.islemler=isl.islemler; P.izleme=[...isl.izleme]; P.atlanan=isl.atlanan; P.atlananSatir=isl.atlananSatir; P.tarihsiz=isl.tarihsiz; P.tipler=isl.tipler; }
        if(ad("BANKA_ISLEMLERI")){ const b=bankaOku(tam(ad("BANKA_ISLEMLERI"))); P.kurumlar.push(...b.kurumlar); }
        if(ad("AYARLAR")){ const a=ayarOku(tam(ad("AYARLAR"))); P.hisseler=a.hisseler; P.kurumlar.push(...a.kurumlar); if(Object.keys(a.ayarlar).length) P.ayarlar=a.ayarlar; }
        P.kaynak=ad("BANKA_ISLEMLERI")||ad("ANA_SAYFA")?"Eski Excel takip programı":ad("AYARLAR")?"Portföy Defteri'nden indirilmiş Excel":"Excel tablosu";
        if(!isl&&!P.hisseler.length&&!P.kurumlar.length) throw new Error(BASLIK_ACIKLAMA);
      } else {
        const txt=String(rd.result).replace(/^﻿/,""); const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        if(!lines.length) throw new Error("Dosya boş.");
        const sep=(lines[0].split(";").length>=lines[0].split(",").length)?";":",";
        const isl=islemOku(lines.map(l=>splitCsv(l,sep))); if(!isl) throw new Error(BASLIK_ACIKLAMA);
        P.islemler=isl.islemler; P.atlanan=isl.atlanan; P.atlananSatir=isl.atlananSatir; P.tarihsiz=isl.tarihsiz; P.tipler=isl.tipler; P.kaynak="CSV dosyası";
      }
      P.izleme=P.izleme.filter(k=>!P.islemler.some(x=>x.kod===k)&&!P.hisseler.some(h=>h.kod===k));
      res(P);
    }catch(e){ rej(e); } };
    if(excel) rd.readAsArrayBuffer(file); else rd.readAsText(file,"utf-8");
  });
}
async function dosyaSec(file){
  const inp=$("#xl-in"); if(inp) inp.value="";
  if(!file) return;
  if(S.readOnly){ toast("Bu sayfada düzenleme yetkin yok."); return; }
  try{ S.ice=await dosyaOku(file); S.iceMod=(!S.demo&&(S.defter.islemler.length||S.defter.hisseler.length))?"ekle":"degistir"; S.iceIzleme=S.ice.islemler.length>0; renderModal(); }
  catch(e){ S.ice={hata:e.message,dosya:file.name}; renderModal(); }
}

      ${(()=>{ const sup=[...new Set(P.islemler.filter(x=>(x.tur==="Alış"||x.tur==="Satış")&&x.fiyat>0&&(()=>{ const f=fiyatOf(x.kod); return f&&f.fiyat>0&&(x.fiyat/f.fiyat>10||x.fiyat/f.fiyat<0.1); })()).map(x=>x.kod))];
        return sup.length?`<li class="down"><b>${esc(sup.join(", "))}</b>: dosyadaki fiyat güncel fiyattan 10 kattan fazla farklı. Fiyat sütunu birim fiyat değil toplam tutar olabilir; yükledikten sonra İşlemler sekmesinden kontrol et.</li>`:""; })()}
      ${P.tarihsiz?`<li><b class="num">${P.tarihsiz}</b> işlemde tarih yok. Sorun değil: kâr/zarar alış fiyatına göre hesaplanır, tarihten etkilenmez. Tarihsiz alışlar en eski, tarihsiz satışlar en yeni işlem sayılır; bulunan temettüler bu kayıtlar için bugünden itibaren aranır.</li>`:""}
      ${P.atlanan?`<li class="down">${P.atlanan} satır okunamadı ve alınmayacak: ${(P.atlananSatir||[]).map(a=>"satır "+a.satir+" ("+esc(a.neden)+")").join(", ")}${P.atlanan>(P.atlananSatir||[]).length?"…":""}</li>`:""}
    </ul></div>
    ${!P.islemler.length?`<div class="banner err"><p><b>Bu dosyada alış/satış kaydı yok, bu yüzden yükleyince hisse görünmez.</b> ${/Eski Excel/.test(P.kaynak)?"Eski programda işlemler DATA sayfasında tutulur; bu dosyanın DATA sayfası boş (programın boş şablonu olabilir).":esc(BASLIK_ACIKLAMA)}</p></div>`:""}
    ${P.izleme.length?`<label class="check" for="ice-izleme"><input type="checkbox" id="ice-izleme" ${S.iceIzleme?"checked":""}><span>İşlemi olmayan ${P.izleme.length} kodu izleme listesine ekle <span class="muted small">(${esc(P.izleme.slice(0,10).join(", "))}${P.izleme.length>10?"…":""})</span></span></label>`:""}
    ${ornek.length?`<div class="tbl-wrap"><table><thead><tr><th>Tarih</th><th>Kod</th><th>İşlem</th><th class="n">Lot</th><th class="n">Fiyat</th><th class="n">Komisyon</th><th>Kurum</th></tr></thead><tbody>${ornek.map(x=>`<tr><td class="num">${x.tarih?fmtDate(x.tarih):`<span class="muted">tarih yok</span>`}</td><td class="num">${esc(x.kod)}</td><td><span class="pill ${pc[x.tur]}">${esc(x.tur)}</span></td><td class="n num">${x.tur==="Temettü"?"—":LOT(x.lot)}</td><td class="n num">${x.tur==="Temettü"?TL(x.tutar):x.fiyat?PX(x.fiyat):"—"}</td><td class="n num">${x.komisyon?nf2.format(x.komisyon):"—"}</td><td>${esc(x.kurum||"—")}</td></tr>`).join("")}</tbody></table></div>${P.islemler.length>8?`<p class="small muted">İlk 8 işlem gösteriliyor.</p>`:""}`:""}

    </div>

async function iceUygula(btn){
  const P=S.ice; if(!P||P.hata) return;
  if(!S.db||!S.uid){ toast("Kaydetmek için giriş yapmış olman gerekiyor."); return; }
  let mevcut=S.demo?null:S.defter;
  if(S.demo){ try{ const ex=await S.db.doc("data/users/"+S.uid+"/defter").get(); if(ex.exists) mevcut=Object.assign(BOS(),clone(ex.data())); }catch(e){} }
  const kayitli=mevcut&&(mevcut.islemler.length||mevcut.hisseler.length);
  const mod=kayitli?S.iceMod:"degistir";
  if(mod==="degistir"&&kayitli&&!arm("ice-degistir",btn,"Silinip değiştirilsin mi? Tekrar tıkla")) return;
  const d=mod==="degistir"?Object.assign(BOS(),{kurumlar:[]}):clone(mevcut);
  if(mod==="degistir"&&kayitli){ d.elleFiyat=mevcut.elleFiyat||{}; d.ayarlar=clone(mevcut.ayarlar||BOS().ayarlar); }
  if(P.ayarlar) d.ayarlar=Object.assign(d.ayarlar||{},P.ayarlar);
  // brokers: file tables win for the same name
  for(const k of P.kurumlar){ const j=d.kurumlar.findIndex(x=>x.ad===k.ad); if(j>=0) d.kurumlar[j]=k; else d.kurumlar.push(k); }
  // transactions
  // duplicates are matched one-for-one against what the ledger already holds, so two identical trades inside the file both stay
  const varIsl=new Map(); for(const x of d.islemler){ const k=islemImza(x); varIsl.set(k,(varIsl.get(k)||0)+1); } let no=d.islemler.reduce((m,x)=>Math.max(m,+x.no||0),0), eklenen=0, atlanan=0; const t0=Date.now();
  const kullanilanNo=new Set(d.islemler.map(x=>+x.no));
  const bugun=today();
  [...P.islemler].sort((a,b)=>{ const x=siraTarih(a), y=siraTarih(b); return x<y?-1:x>y?1:(a.no||0)-(b.no||0); }).forEach((x,i)=>{
    const k=islemImza(x); if(varIsl.get(k)>0){ varIsl.set(k,varIsl.get(k)-1); atlanan++; return; }
    const y=Object.assign({},x,{id:uid6(),t:t0+i}); if(!y.no||kullanilanNo.has(+y.no)) y.no=++no; else no=Math.max(no,+y.no); kullanilanNo.add(+y.no);
    if(y.tur!=="Temettü") y.tutar=null; if(!y.tarih){ y.tarih=""; y.girildi=bugun; } d.islemler.push(y); eklenen++; });
  // stocks: saved settings, then every traded code, then the optional watch list
  const yeniKod=[];
  const hisseEkle=h=>{ const j=d.hisseler.findIndex(x=>x.kod===h.kod); if(j>=0){ if(h.tip) Object.assign(d.hisseler[j],Object.fromEntries(Object.entries(h).filter(([,v])=>v!=null&&v!==""))); } else { d.hisseler.push(Object.assign({tip:tahminTip(h.kod),ad:""},h)); yeniKod.push(h); } };
  P.hisseler.forEach(hisseEkle);
  for(const k of new Set(d.islemler.map(x=>x.kod))) if(!d.hisseler.some(h=>h.kod===k)) hisseEkle(P.tipler?.[k]?{kod:k,tip:P.tipler[k],...(P.tipler[k]==="Fon"?{vergiSinifi:"diger"}:{})}:{kod:k});
  const izlemeAl=$("#ice-izleme")?$("#ice-izleme").checked:S.iceIzleme;
  if(izlemeAl) P.izleme.forEach(k=>hisseEkle({kod:k}));
  // brokers referenced by transactions but not described in the file
  for(const k of new Set(d.islemler.map(x=>x.kurum).filter(Boolean))) if(!d.kurumlar.some(x=>x.ad===k)) d.kurumlar.push({ad:k,tip:"oran",deger:0.02,min:0,bsmv:true});
  if(!d.kurumlar.length) d.kurumlar=BOS().kurumlar;
  d.ornek=false;
  S.defter=d; S.demo=false; S.ice=null; renderModal();
  commit(`${eklenen} işlem${yeniKod.length?`, ${yeniKod.length} kod`:""} yüklendi${atlanan?` · ${atlanan} tekrar eden işlem atlandı`:""}`);
  for(const h of d.hisseler) ensureSembol(h.kod,h.tip||"Hisse");
}

const origRenderMain=renderMain;
async function boot(){
  const use=window.claude?.use; if(!use){ S.loaded=true; render(); return; }
  const [db,user,dl]=await Promise.all([use("db"),use("user"),use("downloads")]);
  S.db=db; S.dl=dl; S.loaded=true;
  if(!db){ render(); return; }
  S.connected=true;
  S.uid=user?await user.id():null;
  const w=user?await user.can("data.write"):null; if(w===false){} // own subtree writes are decided by the store
  db.doc("piyasa/fiyatlar").onSnapshot(s=>{ S.piyasa=s.exists?s.data():{veriler:{}}; S.calc=hesapla(S.defter); arkaPlanRender(); },e=>console.warn(e));
  db.doc("piyasa/gecmis").onSnapshot(s=>{ S.gecmis=s.exists?s.data():{veriler:{}}; if(S.detay) renderDrawer(); },e=>console.warn(e));
  db.doc("piyasa/temettu").onSnapshot(s=>{ S.temettu=s.exists?s.data():null; S.calc=hesapla(S.defter); arkaPlanRender(); },e=>console.warn(e));
  db.doc("piyasa/durum").onSnapshot(s=>{ const once=S.durum; S.durum=s.exists?s.data():null;
    const yeni=Object.entries(S.durum?.kodHata||{}).filter(([k,h])=>h.bulunamadi&&!(once?.kodHata?.[k]?.bulunamadi)&&S.defter.hisseler.some(x=>x.kod===k)).map(([k])=>k);
    if(once&&yeni.length) toast(yeni.join(", ")+" hiçbir fiyat kaynağında bulunamadı. Kodu kontrol et.",7000);
    S.calc=hesapla(S.defter); arkaPlanRender(); },e=>console.warn(e));
  if(!S.uid){ render(); return; }
  db.doc("data/users/"+S.uid+"/defter").onSnapshot(s=>{
    if(s.metadata?.hasPendingWrites) return;
    if(s.exists){ const d=s.data(); if(dirty) return; S.defter=Object.assign(BOS(),clone(d)); S.defter.elleFiyat ||= {}; S.demo=false; }
    S.calc=hesapla(S.defter); render(); if(S.tab==="islem") syncIslemForm();
  },e=>{ S.err="Defterin okunamadı ("+e.code+")."; renderBanner(); });
  db.doc("rapor/"+S.uid).onSnapshot(s=>{ S.rapor=s.exists?s.data():null; if(S.tab==="rapor") renderMain(); },()=>{});
}
// keep the transaction form's dynamic fields in sync whenever main is re-rendered on that tab
renderMain=function(){ origRenderMain(); if(S.tab==="islem") syncIslemForm(); };
boot();
})();
