name: Uygulamayı derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Uygulamayı paketle (kurulumsuz klasör)
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Uçtan uca testler (gerçek Windows'ta, paketlenmiş uygulama)
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PD_EXE = (Resolve-Path "dist/win-unpacked/PortfoyDefteri.exe").Path
          node tests/e2e.js
      - name: Canlı fiyat kaynaklarını dene
        if: always()
        continue-on-error: true
        run: node tests/canli-kaynaklar.js
      - name: Kurulum dosyası ve zip
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PortfoyDefteri-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-sonuclari-windows
          path: |
            test-sonuclari.json
            canli-kaynaklar.json
          if-no-files-found: ignore
      - name: Test sonucu
        if: steps.test.outcome != 'success'
        run: |
          echo "Uçtan uca testlerde başarısız kontrol var; ayrıntı için bu işin özet sayfasına bakın."
          exit 1

  mac:
    runs-on: macos-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Uygulamayı paketle
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Uçtan uca testler (macOS)
        id: test
        continue-on-error: true
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          PD_EXE="$(ls "$APP"/Contents/MacOS/* | head -1)" node tests/e2e.js
      - name: Tanı — imza bilgisi
        if: steps.test.outcome != 'success'
        continue-on-error: true
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          { echo '## İmza bilgisi'; echo '```'; codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5; codesign -dv "$APP" 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Tanı — yalnızca Apple Silicon paketi (universal değil)
        if: steps.test.outcome != 'success'
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac dir --arm64 -c.directories.output=dist-arm64 --publish never
          echo '## Tanı: yalnızca arm64 paketi' >> "$GITHUB_STEP_SUMMARY"
          APP=$(ls -d dist-arm64/mac*/*.app | head -1)
          PD_EXE="$(ls "$APP"/Contents/MacOS/* | head -1)" node tests/e2e.js
      - name: Tanı — imzasız arm64 paketi
        if: steps.test.outcome != 'success'
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac dir --arm64 -c.directories.output=dist-imzasiz -c.mac.identity=null --publish never
          echo '## Tanı: imzasız arm64 paketi' >> "$GITHUB_STEP_SUMMARY"
          APP=$(ls -d dist-imzasiz/mac*/*.app | head -1)
          PD_EXE="$(ls "$APP"/Contents/MacOS/* | head -1)" node tests/e2e.js
      - name: Tanı — ASCII adlı arm64 paketi (PortfoyDefteri)
        if: steps.test.outcome != 'success'
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac dir --arm64 -c.directories.output=dist-ascii -c.productName=PortfoyDefteri --publish never
          echo '## Tanı: ASCII adlı arm64 paketi' >> "$GITHUB_STEP_SUMMARY"
          APP=$(ls -d dist-ascii/mac*/*.app | head -1)
          PD_EXE="$(ls "$APP"/Contents/MacOS/* | head -1)" node tests/e2e.js
      - name: Uçtan uca testler (macOS, paketlenmemiş kaynak — tanı için)
        if: steps.test.outcome != 'success'
        continue-on-error: true
        run: node tests/e2e.js
      - uses: actions/upload-artifact@v4
        with:
          name: PortfoyDefteri-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-sonuclari-mac
          path: test-sonuclari.json
          if-no-files-found: ignore
      - name: Test sonucu
        if: steps.test.outcome != 'success'
        run: |
          echo "Uçtan uca testlerde başarısız kontrol var; ayrıntı için bu işin özet sayfasına bakın."
          exit 1
