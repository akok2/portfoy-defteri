name: Uygulamayı derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Birim testleri (hesaplama, fiyat modülü, zamanlayıcı)
        id: birim
        continue-on-error: true
        run: npm run test:birim
      - name: Uygulamayı paketle (kurulumsuz klasör)
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Uçtan uca testler (gerçek Windows'ta, paketlenmiş uygulama)
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PD_EXE = (Resolve-Path "dist/win-unpacked/PortfoyDefteri.exe").Path
          node tests/e2e.js
      - name: Tutarlılık testi (ekran, Excel, e-posta aynı rakamı veriyor mu)
        id: tutarlilik
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PD_EXE = (Resolve-Path "dist/win-unpacked/PortfoyDefteri.exe").Path
          node tests/tutarlilik.js
      - name: Canlı fiyat kaynaklarını dene
        if: always()
        continue-on-error: true
        run: node tests/canli-kaynaklar.js
      - name: Kurulum dosyası ve zip
        run: npx electron-builder --win --x64 --publish never
      # Install the way the user will (installer, silent mode), then test the installed program over the real internet.
      - name: Kurulum programını çalıştır
        id: kurulum
        continue-on-error: true
        shell: pwsh
        run: |
          $kur = (Get-ChildItem dist\*.exe | Sort-Object Length -Descending | Select-Object -First 1).FullName
          $bul = { (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter PortfoyDefteri.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          # The silent installer can hand the copying to a child process and return early: wait for the program to appear,
          # and try the installation a second time before giving up.
          $exe = $null; $cikis = @()
          foreach ($deneme in 1..2) {
            $p = Start-Process -FilePath $kur -ArgumentList '/S' -Wait -PassThru
            $cikis += $p.ExitCode
            foreach ($i in 1..60) { $exe = & $bul; if ($exe) { break }; Start-Sleep -Seconds 2 }
            if ($exe) { break }
          }
          if (-not $exe) {
            $liste = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { $_.FullName }) -join "`n"
            "## Kurulum (Windows) — program bulunamadı`n`nKurulum programının çıkış kodları: $($cikis -join ', ')`n`ndist: $((Get-ChildItem dist -File | ForEach-Object { $_.Name }) -join ', ')`n`n``````n$liste`n``````n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          $masaustu = Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Portföy Defteri.lnk')
          $baslat = [bool](Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Portföy Defteri.lnk' -ErrorAction SilentlyContinue)
          "## Kurulum (Windows)`n`n- Kurulum dosyası: $(Split-Path $kur -Leaf)`n- Kurulan program: $exe`n- Masaüstü kısayolu: $(if ($masaustu) {'var'} else {'YOK'})`n- Başlat menüsü kısayolu: $(if ($baslat) {'var'} else {'YOK'})`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (-not $exe) { exit 1 }
          "PD_KURULU=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Kurulan uygulamanın içinden canlı fiyat testi (gerçek internet)
        id: canli
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PD_EXE = if ($env:PD_KURULU) { $env:PD_KURULU } else { (Resolve-Path "dist/win-unpacked/PortfoyDefteri.exe").Path }
          node tests/canli-uygulama.js
      - uses: actions/upload-artifact@v6
        with:
          name: PortfoyDefteri-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: test-sonuclari-windows
          path: |
            test-sonuclari.json
            tutarlilik-sonuclari.json
            canli-kaynaklar.json
            canli-uygulama.json
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: ekran-goruntuleri-windows
          path: ekran/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Test sonucu
        if: steps.birim.outcome != 'success' || steps.test.outcome != 'success' || steps.tutarlilik.outcome != 'success' || steps.kurulum.outcome != 'success' || steps.canli.outcome != 'success'
        run: |
          echo "Başarısız kontrol var; ayrıntı için bu işin özet sayfasına bakın."
          exit 1

  mac:
    runs-on: macos-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Birim testleri (hesaplama, fiyat modülü, zamanlayıcı)
        id: birim
        continue-on-error: true
        run: npm run test:birim
      # macOS: the bundle name must be plain ASCII. With "ö" in the bundle name Electron cannot find its
      # helper processes and crashes at start (SIGTRAP). The window title and data folder stay "Portföy Defteri".
      - name: Uygulamayı paketle
        run: npx electron-builder --mac --publish never -c.productName="Portfoy Defteri"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Uçtan uca testler (macOS)
        id: test
        continue-on-error: true
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          PD_EXE="$(ls "$APP"/Contents/MacOS/* | head -1)" node tests/e2e.js
      - name: Uçtan uca testler (macOS, paketlenmemiş kaynak — tanı için)
        if: steps.test.outcome != 'success'
        continue-on-error: true
        run: node tests/e2e.js
      - name: Tutarlılık testi (ekran, Excel, e-posta aynı rakamı veriyor mu)
        id: tutarlilik
        continue-on-error: true
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          PD_EXE="$(ls "$APP"/Contents/MacOS/* | head -1)" node tests/tutarlilik.js
      - name: Uygulamanın içinden canlı fiyat testi (gerçek internet)
        id: canli
        continue-on-error: true
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          PD_EXE="$(ls "$APP"/Contents/MacOS/* | head -1)" node tests/canli-uygulama.js
      - uses: actions/upload-artifact@v6
        with:
          name: PortfoyDefteri-macOS
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: test-sonuclari-mac
          path: |
            test-sonuclari.json
            tutarlilik-sonuclari.json
            canli-uygulama.json
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: ekran-goruntuleri-mac
          path: ekran/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Test sonucu
        if: steps.birim.outcome != 'success' || steps.test.outcome != 'success' || steps.tutarlilik.outcome != 'success' || steps.canli.outcome != 'success'
        run: |
          echo "Başarısız kontrol var; ayrıntı için bu işin özet sayfasına bakın."
          exit 1
